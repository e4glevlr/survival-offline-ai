name: ResQApp
options:
  bundleIdPrefix: com.resq
  deploymentTarget:
    iOS: "17.0"
packages:
  ResQKit:
    path: ../ResQKit
targets:
  ResQApp:
    type: application
    platform: iOS
    sources: [ResQApp]
    dependencies:
      - package: ResQKit
        product: ResQUI
      - package: ResQKit
        product: ResQCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huzastudio.resq
        DEVELOPMENT_TEAM: 22KWPJB89L
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: ResQ
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ResQ dùng GPS để hiện toạ độ SOS, giờ mặt trời lặn và ghim vị trí. GPS chạy cả khi không có sóng."
        INFOPLIST_KEY_NSCameraUsageDescription: "Chụp ảnh cây, nấm, vết thương để tra cứu. Ảnh chỉ nằm trên máy."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nói câu hỏi thay vì gõ, tiện khi đang sơ cứu hoặc đeo găng."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Chuyển giọng nói tiếng Việt thành chữ, ưu tiên xử lý ngay trên máy."
        TARGETED_DEVICE_FAMILY: "1"
  ResQAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ResQAppUITests]
    dependencies:
      - target: ResQApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  ResQApp:
    build:
      targets:
        ResQApp: all
        ResQAppUITests: [test]
    test:
      targets: [ResQAppUITests]
